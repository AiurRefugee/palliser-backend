server:
  port: ${PORT:8080}
spring:
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:sqlite:./data/palliser-dev.sqlite}
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
  sql:
    init:
      mode: always
      platform: ${DB_PLATFORM:sqlite}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 700ms
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  seed-enabled: ${SEED_ENABLED:true}
