name: Backend checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify seed coverage
        run: python3 scripts/verify_seed.py
      - name: Build and test
        run: mvn -B --no-transfer-progress test
